<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · TriMap</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f3f4f7;
        color: #0c1220;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #080b11; color: #e9eef6; }
        a { background: #e9eef6; color: #0a0e15; }
      }
      main { padding: 24px; text-align: center; max-width: 28rem; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; opacity: 0.75; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 12px;
        background: #0c1220;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page does not exist. The race finder is one click away.</p>
      <a id="home" href="/">Find a race on TriMap</a>
    </main>
    <script>
      // On GitHub Pages a project site lives under /<repo>/; link to its root.
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var project = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/';
        document.getElementById('home').href = project;
      })();
    </script>
  </body>
</html>
