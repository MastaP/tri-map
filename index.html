<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TriMap · Find a full, half or T100 triathlon to enter</title>
    <meta
      name="description"
      content="Find a full or half-distance triathlon you can enter: IRONMAN, 70.3, Challenge, T100 and independents worldwide, on one map."
    />
    <!-- Updated by the app to match the chosen theme (header colour). -->
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TriMap" />
    <meta property="og:title" content="TriMap · Find a full, half or T100 triathlon to enter" />
    <meta
      property="og:description"
      content="Every IRONMAN, 70.3, Challenge, T100 and notable independent race age-groupers can enter, on one map. Filter by distance, date, region, entry and course."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TriMap: find a full or half triathlon you can enter" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin />
    <script>
      // Apply the saved/system theme before first paint (no flash).
      (function () {
        try {
          var pref = localStorage.getItem('trimap.theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Painted before the app's JavaScript runs; React replaces it. */
      .tm-shell {
        min-height: 100vh;
        background: #fff;
        color: #545e6f;
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .tm-shell-bar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid #e2e6ec;
      }
      .tm-shell-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: #0c1220;
      }
      .tm-shell-name {
        font:
          italic 700 24px/1 'Arial Narrow',
          system-ui,
          sans-serif;
        color: #0c1220;
        letter-spacing: -0.02em;
      }
      .tm-shell-name b {
        color: #3f6212;
      }
      .tm-shell p {
        margin: 0;
        padding: 24px 16px;
      }
      [data-theme='dark'] .tm-shell {
        background: #0f141d;
        color: #a2acbc;
      }
      [data-theme='dark'] .tm-shell-bar {
        border-color: #222b39;
      }
      [data-theme='dark'] .tm-shell-name {
        color: #e9eef6;
      }
      [data-theme='dark'] .tm-shell-name b {
        color: #c4f031;
      }
    </style>
    <!-- Google tag (gtag.js). Loaded only on the production host so local dev and e2e runs send no hits. -->
    <script>
      if (location.hostname === 'mastap.github.io') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        gtag('js', new Date());
        gtag('config', 'G-JNRXNEP8TM');
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-JNRXNEP8TM';
        document.head.appendChild(ga);
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="tm-shell" aria-busy="true">
        <div class="tm-shell-bar">
          <span class="tm-shell-mark"></span><span class="tm-shell-name">TRI<b>MAP</b></span>
        </div>
        <p>Loading races…</p>
      </div>
    </div>
    <noscript>TriMap needs JavaScript to show the race map and search.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
