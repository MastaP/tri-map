<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TriMap · Find your next full, half or T100 triathlon</title>
    <meta
      name="description"
      content="Search every IRONMAN, IRONMAN 70.3, Challenge Family, T100 and notable independent full- and half-distance triathlon on one world map, by distance, date and region."
    />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="TriMap · Triathlon race finder" />
    <meta property="og:description" content="Full, half and T100 triathlons worldwide on one map." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin />
    <script>
      // Apply the saved/system theme before first paint (no flash).
      (function () {
        try {
          var pref = localStorage.getItem('trimap.theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js). Loaded only on the production host so local dev and e2e runs send no hits. -->
    <script>
      if (location.hostname === 'mastap.github.io') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        gtag('js', new Date());
        gtag('config', 'G-JNRXNEP8TM');
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-JNRXNEP8TM';
        document.head.appendChild(ga);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TriMap needs JavaScript to show the race map and search.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
