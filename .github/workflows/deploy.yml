name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild (05:00 UTC): each deploy bundles a fresh T100 registration status (see
  # the refresh step below), and the per-race share pages (race/<id>/) and their "next
  # date" text are generated at build time, so without a push they would go stale as races
  # are held. Scheduled runs use the default branch.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # T100 registration status (t100triathlon.com, else the PTO entry platform's explicit
      # signals), so each deploy bundles a fresh one. It can never fail or hold up the
      # deploy: a failed refresh only warns, the script stops making requests after 3
      # minutes and caps its waiting after "too many requests", the step is cut off after 5
      # minutes, and in every such case the build goes on with the committed
      # data/registration/t100.json (the app hides a status older than 30 days). The
      # IRONMAN status is refreshed by hand (`npm run refresh:ironman`): ironman.com blocks
      # GitHub-hosted runners, and the script refuses to run in GitHub Actions.
      - name: Refresh T100 registration status
        timeout-minutes: 5
        continue-on-error: true
        run: npm run refresh:t100 || echo "::warning::T100 registration refresh failed; building with the committed data/registration/t100.json"

      # Main data gate: schema, unique ids, coordinates, URLs. Fails on any error.
      - run: npm run validate:data

      - run: npm run typecheck

      - run: npm test

      # The build also refuses invalid race data. VITE_REPO_URL is derived from
      # GITHUB_REPOSITORY for the header and "Report a correction" links.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
